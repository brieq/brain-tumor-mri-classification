[project]
name = "brain-tumor-mri-classification"
version = "0.1.0"
description = ""
authors = [
    {name = "Briek Henry"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "imagehash (>=4.3.2,<5.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "torch (>=2.11.0,<3.0.0)",
    "torchvision (>=0.26.0,<0.27.0)"
]

[tool.poetry]
package-mode = false


[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch"}
torchvision = {source = "pytorch"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)"
]
